<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, activePage, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Smart Grocery Inventory</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Application CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Top Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Layout Wrapper: Sidebar + Content -->
    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Page Content Insertion Point -->
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
