<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg top-navbar sticky-top">
    <div class="container-fluid px-2">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-cart-check-fill"></i> SmartGrocery
        </a>

        <div class="d-flex align-items-center ms-auto">
            <!-- Simulated Scanner Quick Link -->
            <a th:href="@{/scanning}" class="btn btn-outline-success btn-sm me-3">
                <i class="bi bi-upc-scan me-1"></i> Scan
            </a>

            <!-- User Menu -->
            <div class="dropdown" sec:authorize="isAuthenticated()">
                <button class="btn btn-light dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown">
                    <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px; font-weight: 600;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <span sec:authentication="name" class="d-none d-sm-inline fw-semibold text-dark">User</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-gear me-2"></i> Settings</a></li>
                    <li><a class="dropdown-item" th:href="@{/alerts}"><i class="bi bi-bell me-2"></i> Notifications</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="dropdown-item text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i> Sign Out
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
