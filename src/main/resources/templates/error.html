<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Notice - Smart Grocery Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-container">

<div class="card auth-card text-center" style="max-width: 500px;">
    <div class="card-body p-4">
        <div class="rounded-circle bg-warning text-dark d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-exclamation-triangle-fill fs-2"></i>
        </div>

        <h3 class="fw-bold text-dark mb-2" th:text="${error != null ? error : 'Something Went Wrong'}">Notice</h3>
        <p class="text-danger fw-semibold mb-3" th:text="${message != null ? message : 'An error occurred while processing your request.'}"></p>

        <div class="p-2 bg-light rounded text-muted small mb-4" th:if="${status != null}">
            HTTP Status: <strong th:text="${status}">500</strong> &bull;
            <span th:if="${timestamp != null}" th:text="${timestamp}"></span>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                &larr; Go Back
            </a>
        </div>
    </div>
</div>

</body>
</html>
