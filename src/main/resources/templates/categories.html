<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, 'categories', ~{::content})}">
<head>
    <title>Categories - Smart Grocery Inventory</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Grocery Categories</h2>
            <p class="text-muted mb-0">Database-backed category classification and validation</p>
        </div>
    </div>

    <div class="row g-4">
        <!-- Add Category Form -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header fw-bold">
                    <i class="bi bi-tag-fill text-success me-2"></i> Add New Category
                </div>
                <div class="card-body p-3">
                    <form th:action="@{/categories/add}" th:object="${categoryDto}" method="post">
                        <div class="mb-3">
                            <label for="catName" class="form-label fw-semibold">Category Name *</label>
                            <input type="text" id="catName" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Organic Produce" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="catDesc" class="form-label fw-semibold">Description</label>
                            <textarea id="catDesc" th:field="*{description}" class="form-control" rows="3"
                                      placeholder="Brief explanation of items in this category"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-semibold">
                            Create Category
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Categories Table -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Category Name</th>
                                    <th>Description</th>
                                    <th class="text-end pe-3">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td class="ps-3 fw-bold text-dark">
                                        <i class="bi bi-folder-check text-success me-2"></i>
                                        <span th:text="${cat.name}">Category</span>
                                    </td>
                                    <td class="text-muted" th:text="${cat.description}">Description</td>
                                    <td class="text-end pe-3">
                                        <form th:action="@{/categories/delete/{id}(id=${cat.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Are you sure you want to delete this category? (Will be rejected if items belong to it)');">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
